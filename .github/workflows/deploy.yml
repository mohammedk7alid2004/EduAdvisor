name: Deploy EduAdvisor

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: eduadvisor-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore EduAdvisor.sln

      - name: Build
        run: dotnet build EduAdvisor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EduAdvisor.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish EduAdvisor.API/EduAdvisor.API.csproj --configuration Release --output publish --no-build

      - name: Strip sensitive files
        shell: pwsh
        run: |
          Remove-Item -Path "publish/appsettings.Development.json" -ErrorAction SilentlyContinue
          Remove-Item -Path "publish/*.pdb" -ErrorAction SilentlyContinue

      - name: Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/appsettings.Development.json
            **/*.pdb
            **/.git*

      - name: Health check
        if: ${{ secrets.HEALTHCHECK_URL != '' }}
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "${{ secrets.HEALTHCHECK_URL }}" -UseBasicParsing -TimeoutSec 15
              if ($resp.StatusCode -ge 200 -and $resp.StatusCode -lt 400) {
                $ok = $true
                break
              }
            } catch {
              Write-Host "Attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            Write-Error "Health check failed after deployment."
            exit 1
          }

      - name: Deployment summary
        run: echo "Deployed commit ${{ github.sha }} to production"
