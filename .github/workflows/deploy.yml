name: Deploy EduAdvisor

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # Download source code
      - name: Checkout source
        uses: actions/checkout@v4

      # Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restore NuGet packages
      - name: Restore Packages
        run: dotnet restore EduAdvisor.sln

      # Build solution
      - name: Build Project
        run: dotnet build EduAdvisor.sln --configuration Release --no-restore

      # Publish API
      - name: Publish API
        run: dotnet publish EduAdvisor.API/EduAdvisor.API.csproj --configuration Release --output publish --no-build

      # Deploy to MonsterASP FTP
      - name: Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/