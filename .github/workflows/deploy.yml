name: Deploy EduAdvisor

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: eduadvisor-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    environment: production  

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Packages
        run: dotnet restore EduAdvisor.sln
       
      - name: Build Project
        run: dotnet build EduAdvisor.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test EduAdvisor.sln --configuration Release --no-build --verbosity normal
        continue-on-error: false  
      - name: Publish API
        run: >
          dotnet publish EduAdvisor.API/EduAdvisor.API.csproj
          --configuration Release
          --output publish
          --no-build

      - name: Remove sensitive/dev files
        shell: pwsh
        run: |
          Remove-Item -Path "publish/appsettings.Development.json" -ErrorAction SilentlyContinue
          Remove-Item -Path "publish/*.pdb" -ErrorAction SilentlyContinue

      - name: Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/appsettings.Development.json
            **/*.pdb
            **/.git*

      - name: Deployment summary
        run: echo "✅ Deployed commit ${{ github.sha }} to production"
